<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Art Mail Club — Hover Animation</title>
  <link rel="stylesheet" href="style.css" />
</head>
<body>
  <div id="scroll-track">
  <main id="animation-container" aria-label="Animação controlada pelo movimento do mouse">
    <canvas id="animation-canvas" width="1600" height="900"></canvas>

    <p id="scroll-hint" aria-hidden="true">Role para revelar</p>

    <div id="loader" role="status" aria-live="polite">
      <div class="loader-bar"><span id="loader-fill"></span></div>
      <p id="loader-text">Carregando frames… 0%</p>
    </div>

    <p id="hint">Passe o mouse sobre os itens do envelope</p>

    <button id="controls-toggle" type="button" aria-expanded="false" aria-controls="controls">
      Ajustes
    </button>

    <section id="controls" class="collapsed" aria-label="Ajustes da animação">
      <label class="control">
        <span class="control-label">
          Velocidade <output id="speed-value">1.0×</output>
        </span>
        <input id="speed" type="range" min="0.2" max="4" step="0.1" value="1" />
        <small>Velocidade de reprodução de cada sequência ao passar o mouse.</small>
      </label>

      <label class="control">
        <span class="control-label">
          Precisão <output id="precision-value">100%</output>
        </span>
        <input id="precision" type="range" min="5" max="100" step="1" value="100" />
        <small>100% responde na hora; valores menores suavizam o início e o fim.</small>
      </label>

      <button id="reset" type="button">Restaurar padrão</button>
    </section>
  </main>
  </div>

  <script src="script.js" defer></script>

</body>
</html>
